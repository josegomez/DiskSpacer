[package]
name = "sizematters"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37.0"
egui-winit = "0.37"
egui_system_font_provider = { version = "0.37", default-features = false }
globset = "0.4.21"
hdrshot-egui-backend = "0.2"
parking_lot = "0.13.0"
rayon = "1.12.0"
regex = "1.13.2"
rfd = "0.18.0"
similar = "3.2.1"
softbuffer = "0.4"
trash = "5.4.0"
winit = "0.30"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
flate2 = "1.1.11"

[build-dependencies]
embed-resource = "3.0.12"
